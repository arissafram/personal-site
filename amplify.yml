version: 1
# The backend (amplify/: the magnetic poem's Lambda and table) deploys first
# and writes amplify_outputs.json, which the frontend build reads for the
# poem's save URL.
backend:
  phases:
    build:
      commands:
        - nvm use 20
        # Not `npm ci`: @aws-amplify/data-construct bundles copies of its
        # dependencies that don't match its own requirements (semver,
        # @opentelemetry/core), so npm ci's lockfile check always fails, even
        # with a freshly generated lockfile. npm install keeps the lockfile's
        # versions and tolerates it.
        - npm install --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
