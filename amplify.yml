version: 1
# The backend (amplify/: the magnetic poem's Lambda and table) deploys first
# and writes amplify_outputs.json, which the frontend build reads for the
# poem's save URL.
backend:
  phases:
    build:
      commands:
        - nvm use 20
        - npm ci
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
